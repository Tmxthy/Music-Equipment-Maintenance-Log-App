<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guitar Maintenance Log</title>
    
</head>
<body>
    <div class="container">
        <h1>Music Equipment Maintenance Log</h1>
        <form id="equipmentForm">
            <label for="equipmentName">Equipment Name:</label>
            <input type="text" id="equipmentName" name="equipmentName" required><br><br>

            <label for="equipmentType">Equipment Type:</label>
            <select id="equipmentType" name="equipmentType" required>
                <option value="">Select</option>
                <option value="Guitar">Guitar</option>
                <option value="Bass">Bass</option>
                <option value="Keyboard">Keyboard</option>
                <option value="Drums">Drums</option>
                <option value="Amplifier">Amplifier</option>
                <option value="Microphone">Microphone</option>
                <option value="Audio Interface">Audio Interface</option>
                <option value="Effects Pedal">Effects Pedal</option>
                <option value="Speaker">Speaker</option>
                <option value="Cable">Cable</option>
                <option value="Other">Other</option>
            </select><br><br>

            <label for="equipmentBrand">Equipment Brand:</label>
            <input type="text" id="equipmentBrand" name="equipmentBrand" required><br><br>

            <label for="equipmentModel">Equipment Model:</label>
            <input type="text" id="equipmentModel" name="equipmentModel" required><br><br>

            <label for="serial_Number">Serial Number:</label>
            <input type="text" id="serial_Number" name="serial_Number" required><br><br>

            <label for="purchasePrice">Purchase Price:</label>
            <input type="number" id="purchasePrice" name="purchasePrice" step="0.01" required><br><br>
            
            <label for="purchaseDate">Date:</label>
            <input type="date" id="purchaseDate" name="purchaseDate" required><br><br>

            <label for="condition">Condition:</label>
            <select id="condition" name="condition" required>
                <option value="">Select</option>
                <option value="New">New</option>
                <option value="Good">Good</option>
                <option value="Fair">Fair</option>
                <option value="Poor">Poor</option>
            </select><br><br>

            <label for="notes">Notes:</label><br>
            <textarea id="notes" name="notes" rows="4" cols="50"></textarea><br><br>

            <button type="submit">Add Entry</button>
        </form>

        <p id="statusMessage"></p> 

        <h2>Maintenance Entries</h2>

        <ul id="entriesList"></ul>

        <script src="app.js"></script>
</body>
</html>
